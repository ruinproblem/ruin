[package]
name = "ruin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ruin"

[features]
default = []
devnet = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
solana-security-txt = "=1.1.3"
anchor-lang = { version = "=1.1.2", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "=1.1.2", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }

solana-sysvar = { version = "3.1.1", features = ["bytemuck"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
